name: APK Halage Sync

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK (lien de téléchargement public)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk halage-sync.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk halage-sync.apk --title "Halage Sync (Android)" --notes "Mini-app qui envoie Samsung Health vers Halage. Télécharge halage-sync.apk sur le téléphone."
